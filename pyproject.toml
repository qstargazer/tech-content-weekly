[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-content-weekly"
version = "0.3.0"
description = "Multi-platform technology video and podcast weekly report"
requires-python = ">=3.11"
dependencies = ["openai>=1.50,<3"]

[project.scripts]
tech-content-weekly = "tech_content_weekly.cli:main"

[tool.setuptools.packages.find]
include = ["tech_content_weekly*"]
