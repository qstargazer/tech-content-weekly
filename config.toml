[report]
title = "科技内容 Weekly Report"
timezone = "Asia/Shanghai"
lookback_days = 7
monthly_days = 30
monthly_top_n = 3

[email]
enabled = true
recipients = ["stargazerq@foxmail.com"]
subject_prefix = "[科技内容周报]"
smtp_host = "smtp.gmail.com"
smtp_port = 465

[ai]
enabled = true
openai_model = "gpt-5-mini"
deepseek_model = "deepseek-chat"

[filters]
# YouTube / Bilibili 视频低于此时长（分钟）时不进入周报；抓不到时长则保留。
min_video_duration_minutes = 10

# Bilibili 使用 QNAP 自建 RSSHub。RSSHUB_BASE_URL 通过 .env 或 Actions
# 环境变量注入，例如 http://192.168.100.172:1200；不要将内网地址暴露到公网。
# 未填写 feed_url 时，该来源会被跳过并写入数据状态，不影响整期。
[[creators]]
name = "opus精译"
platform = "bilibili"
id = "163682133"
url = "https://space.bilibili.com/163682133"
enabled = true
feed_url = "$RSSHUB_BASE_URL/bilibili/user/video/163682133?key=$RSSHUB_ACCESS_KEY"

